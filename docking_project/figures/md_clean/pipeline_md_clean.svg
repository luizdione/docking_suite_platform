<svg viewBox="0 0 980 1468" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="980" height="1468" fill="#ffffff"/>
<text x="490.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1a1a1a">Pipeline da Dinamica Molecular — md_clean.py</text>
<text x="490.0" y="86" text-anchor="middle" font-size="17" fill="#666">Tripanotiona redutase (TcTR) + cofator FAD + farmaco, em agua — o que cada etapa faz e por que</text>
<text x="490.0" y="112" text-anchor="middle" font-size="13.5" fill="#999">As caixas correm de cima para baixo. Os losangos ambar sao "portoes": se reprovarem, o pipeline PARA antes de gastar horas de GPU.</text>
<rect x="40" y="134" width="900" height="282" rx="16" fill="#eaf2fb"/>
<text x="135" y="275.0" text-anchor="middle" transform="rotate(-90 135 275.0)" font-size="17" font-weight="700" fill="#1f77b4" letter-spacing="1">PREPARO</text>
<rect x="40" y="428" width="900" height="282" rx="16" fill="#fff6e0"/>
<text x="135" y="569.0" text-anchor="middle" transform="rotate(-90 135 569.0)" font-size="17" font-weight="700" fill="#c9920a" letter-spacing="1">CONFERENCIAS PRE-VOO</text>
<rect x="40" y="722" width="900" height="402" rx="16" fill="#fdeede"/>
<text x="135" y="923.0" text-anchor="middle" transform="rotate(-90 135 923.0)" font-size="17" font-weight="700" fill="#e8731a" letter-spacing="1">RELAXAR & AQUECER</text>
<rect x="40" y="1136" width="900" height="126" rx="16" fill="#e7f5ec"/>
<text x="135" y="1199.0" text-anchor="middle" transform="rotate(-90 135 1199.0)" font-size="17" font-weight="700" fill="#2e8b57" letter-spacing="1">PRODUCAO</text>
<rect x="40" y="1274" width="900" height="126" rx="16" fill="#f0e9f7"/>
<text x="135" y="1337.0" text-anchor="middle" transform="rotate(-90 135 1337.0)" font-size="17" font-weight="700" fill="#6a3d9a" letter-spacing="1">ANALISE</text>
<rect x="235" y="150" width="660" height="88" rx="12" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
<rect x="235" y="150" width="7" height="88" rx="3" fill="#1f77b4"/>
<text x="259" y="180" font-size="18" font-weight="700" fill="#1a1a1a">1. Montar o sistema</text>
<text x="259" y="204" font-size="14.5" fill="#333">Junta a proteina (TcTR) + 2 cofatores FAD + o farmaco na pose do docking e</text>
<text x="259" y="222" font-size="14.5" fill="#333">mergulha tudo em agua com sais — como o ambiente dentro da celula.</text>
<text x="259" y="246" font-size="12.5" font-family="Consolas, monospace" fill="#1f77b4">PDBFixer + Modeller + addSolvent (TIP3P + Na/Cl)</text>
<line x1="565.0" y1="238" x2="565.0" y2="285" stroke="#888" stroke-width="2.2"/>
<polygon points="559.0,279 571.0,279 565.0,287" fill="#888"/>
<rect x="235" y="288" width="660" height="106" rx="12" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
<rect x="235" y="288" width="7" height="106" rx="3" fill="#1f77b4"/>
<text x="259" y="318" font-size="18" font-weight="700" fill="#1a1a1a">2. Aplicar o 'force-field'</text>
<text x="259" y="342" font-size="14.5" fill="#333">Define as regras de fisica de cada atomo: massas, cargas e as 'molas' das</text>
<text x="259" y="360" font-size="14.5" fill="#333">ligacoes, angulos e torcoes. Sem isso a simulacao nao sabe como os atomos</text>
<text x="259" y="378" font-size="14.5" fill="#333">se atraem/repelem.</text>
<text x="259" y="402" font-size="12.5" font-family="Consolas, monospace" fill="#1f77b4">amber14 + FAD_v3.xml + LIG.xml  ->  createSystem (PME)</text>
<line x1="565.0" y1="394" x2="565.0" y2="441" stroke="#888" stroke-width="2.2"/>
<polygon points="559.0,435 571.0,435 565.0,443" fill="#888"/>
<rect x="235" y="444" width="660" height="106" rx="12" fill="#ffffff" stroke="#c9920a" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="259" y="474" font-size="18" font-weight="700" fill="#1a1a1a">Conferencia A: force-field integro?</text>
<text x="259" y="498" font-size="14.5" fill="#333">Checa em segundos se o FF do FAD e do farmaco tem torcoes, cargas e LJ</text>
<text x="259" y="516" font-size="14.5" fill="#333">coerentes. Se reprovar, PARA — evita gastar horas numa MD que so daria</text>
<text x="259" y="534" font-size="14.5" fill="#333">'NaN'.</text>
<text x="259" y="558" font-size="12.5" font-family="Consolas, monospace" fill="#c9920a">validate_ff.py  (PARE se FAIL)</text>
<line x1="565.0" y1="550" x2="565.0" y2="597" stroke="#888" stroke-width="2.2"/>
<polygon points="559.0,591 571.0,591 565.0,599" fill="#888"/>
<rect x="235" y="600" width="660" height="88" rx="12" fill="#ffffff" stroke="#c9920a" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="259" y="630" font-size="18" font-weight="700" fill="#1a1a1a">Conferencia B: farmaco ancorado?</text>
<text x="259" y="654" font-size="14.5" fill="#333">Confirma que o farmaco esta DENTRO do bolso da proteina (em contato), e</text>
<text x="259" y="672" font-size="14.5" fill="#333">nao solto na agua. Se estiver solto, PARA e revisa a pose.</text>
<text x="259" y="696" font-size="12.5" font-family="Consolas, monospace" fill="#c9920a">check_ligand_binding.py  (PARE se solto)</text>
<line x1="565.0" y1="688" x2="565.0" y2="735" stroke="#888" stroke-width="2.2"/>
<polygon points="559.0,729 571.0,729 565.0,737" fill="#888"/>
<rect x="235" y="738" width="660" height="88" rx="12" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
<rect x="235" y="738" width="7" height="88" rx="3" fill="#e8731a"/>
<text x="259" y="768" font-size="18" font-weight="700" fill="#1a1a1a">3. Minimizar energia</text>
<text x="259" y="792" font-size="14.5" fill="#333">Desfaz choques e tensoes entre atomos vizinhos — como afrouxar nos</text>
<text x="259" y="810" font-size="14.5" fill="#333">apertados antes de mover qualquer coisa.</text>
<text x="259" y="834" font-size="12.5" font-family="Consolas, monospace" fill="#e8731a">minimizeEnergy  ->  salva minimized_<tag>.pdb</text>
<line x1="565.0" y1="826" x2="565.0" y2="873" stroke="#888" stroke-width="2.2"/>
<polygon points="559.0,867 571.0,867 565.0,875" fill="#888"/>
<rect x="235" y="876" width="660" height="88" rx="12" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
<rect x="235" y="876" width="7" height="88" rx="3" fill="#e8731a"/>
<text x="259" y="906" font-size="18" font-weight="700" fill="#1a1a1a">4. Aquecer devagar</text>
<text x="259" y="930" font-size="14.5" fill="#333">Sobe a temperatura de 5 K ate 300 K (~temperatura do corpo) em etapas</text>
<text x="259" y="948" font-size="14.5" fill="#333">curtas, para o sistema nao 'explodir' de uma vez.</text>
<text x="259" y="972" font-size="12.5" font-family="Consolas, monospace" fill="#e8731a">warm-up NVT: 5K -> 50K -> 300K (dt 0.25 -> 1 fs)</text>
<line x1="565.0" y1="964" x2="565.0" y2="1011" stroke="#888" stroke-width="2.2"/>
<polygon points="559.0,1005 571.0,1005 565.0,1013" fill="#888"/>
<rect x="235" y="1014" width="660" height="88" rx="12" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
<rect x="235" y="1014" width="7" height="88" rx="3" fill="#e8731a"/>
<text x="259" y="1044" font-size="18" font-weight="700" fill="#1a1a1a">5. Equilibrar</text>
<text x="259" y="1068" font-size="14.5" fill="#333">Deixa o sistema se acomodar no volume e na pressao fisiologicos (1 bar)</text>
<text x="259" y="1086" font-size="14.5" fill="#333">antes de medir qualquer coisa.</text>
<text x="259" y="1110" font-size="12.5" font-family="Consolas, monospace" fill="#e8731a">NVT 50 ps  +  NPT 500 ps @ 1 bar</text>
<line x1="565.0" y1="1102" x2="565.0" y2="1149" stroke="#888" stroke-width="2.2"/>
<polygon points="559.0,1143 571.0,1143 565.0,1151" fill="#888"/>
<rect x="235" y="1152" width="660" height="88" rx="12" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
<rect x="235" y="1152" width="7" height="88" rx="3" fill="#2e8b57"/>
<text x="259" y="1182" font-size="18" font-weight="700" fill="#1a1a1a">6. Producao (a 'filmagem')</text>
<text x="259" y="1206" font-size="14.5" fill="#333">Agora sim: registra o movimento real dos atomos por X nanossegundos (ex.:</text>
<text x="259" y="1224" font-size="14.5" fill="#333">50 ns). Salva a trajetoria e checkpoints para retomar se faltar energia.</text>
<text x="259" y="1248" font-size="12.5" font-family="Consolas, monospace" fill="#2e8b57">dt = 2 fs, Andersen  ->  md_<tag>.dcd + .chk</text>
<line x1="565.0" y1="1240" x2="565.0" y2="1287" stroke="#888" stroke-width="2.2"/>
<polygon points="559.0,1281 571.0,1281 565.0,1289" fill="#888"/>
<rect x="235" y="1290" width="660" height="88" rx="12" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
<rect x="235" y="1290" width="7" height="88" rx="3" fill="#6a3d9a"/>
<text x="259" y="1320" font-size="18" font-weight="700" fill="#1a1a1a">7. Analisar</text>
<text x="259" y="1344" font-size="14.5" fill="#333">Mede a estabilidade: a proteina ficou estavel? o farmaco continuou no</text>
<text x="259" y="1362" font-size="14.5" fill="#333">bolso ou saiu? Gera os graficos de RMSD/RMSF e um resumo.</text>
<text x="259" y="1386" font-size="12.5" font-family="Consolas, monospace" fill="#6a3d9a">RMSD + RMSF + convergencia  ->  PNG + JSON</text>
</svg>