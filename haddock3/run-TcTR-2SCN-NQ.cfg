# =====================================================================
# HADDOCK3 - docking guiado por informacao (AIRs)
# Ligante: 2-SCN-NQ  |  Receptor: TcTR (T. cruzi trypanothione reductase, 1BZL)
# Sitio do substrato (trypanothione), ancorado em CYS53/CYS58/HIS461.
# =====================================================================
# Rode de DENTRO da pasta haddock3/:
#     haddock3 run-TcTR-2SCN-NQ.cfg
# Requer: lig.top + lig.param (topologia/parametros CNS do ligante) -- ver
# HADDOCK3_PROTOCOLO.md secao 2.

run_dir = "run-TcTR-2SCN-NQ"
mode = "local"
ncores = 8
# postprocess gera relatorios/plots de analise automaticamente
postprocess = true
clean = true

molecules = [
    "TcTR_receptor.pdb",
    "ligand_2SCN-NQ.pdb",
    ]

# ----------------------------------------------------------------------
[topoaa]
# topologia do receptor (CNS/OPLS) + ligante nao-padrao (LIG)
# Gere lig.top/lig.param a partir do 2-SCN-NQ.mol2 (ver protocolo, secao 2).
ligand_param_fname = "lig.param"
ligand_top_fname = "lig.top"

# ----------------------------------------------------------------------
[rigidbody]
# amostragem rigida guiada pelas AIRs do sitio
ambig_fname = "ambig.tbl"
sampling = 1000
# o ligante pode partir de fora do bolso; as AIRs o conduzem ao sitio

[caprieval]
# avaliacao (se voce tiver uma pose de referencia, aponte com reference_fname
# para obter i-RMSD/l-RMSD automaticos)
# reference_fname = "ref_complex.pdb"

[seletop]
select = 200

# ----------------------------------------------------------------------
[flexref]
# refinamento semi-flexivel da interface (cadeias laterais + ligante)
ambig_fname = "ambig.tbl"

[caprieval]

[emref]
# minimizacao final em solvente implicito
ambig_fname = "ambig.tbl"

[caprieval]

# ----------------------------------------------------------------------
[clustfcc]
# clustering por fraction of common contacts
[seletopclusts]
top_models = 4

[caprieval]
# avaliacao final por cluster (score HADDOCK, RMSD intra-cluster, etc.)
